    <p>我院2026年接收推荐免试研究生（含直博生）预报名工作即将开始，现将有关事项通知如下。</p>
    <p>一、报名时间：2025年7月10日至7月25日，逾期不再受理。</p>
    <p>二、申请条件：纳入国家普通本科招生计划录取的2026届应届毕业生，前六学期平均绩点不低于3.2。</p>
    <p>三、提交材料：申请表、成绩单、排名证明、个人陈述，通过学院系统在线提交。</p>
    <p>四、考核方式：笔试与面试相结合，时间为8月上旬，具体安排另行通知。</p>
    <p>咨询电话：021-6590XXXX（学院教务办公室），邮箱：jxy@mail.shufe.edu.cn。</p>
