[project]
name = "sufe-campus-qa"
version = "0.1.0"
description = "上财校园问答智能体（SCAI 大赛作品）"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.6",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
    "trafilatura>=1.9",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "openai>=1.40",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
sufe-qa = "sufe_qa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sufe_qa"]

[tool.ruff]
line-length = 100
