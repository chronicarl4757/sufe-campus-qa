# 种子站清单（列表页结构与选择器已逐个用真实页面验证，2026-07-31）
#
# 站点三类形态：
# - gs（研究生院）/ cob（商学院）为自建站：文章页 /Home/Detail/<id>，静态可抓；
# - 各学院多为 _wp3 站：文章页 /xx/yy/c<栏目>a<id>/page.htm，列表页静态链接
#   （注意部分模板 href 用单引号，选择器统一 a[href$="page.htm"]，url_prefix
#   锚定站根，侧边栏文章顺带收录，均为校内通知类内容）；
# - jwc 列表页为 generalQuery 接口 JS 渲染（需服务端命名查询，未逆向），
#   改以首页静态文章链接为种子；career 就业网为招聘系统（JS/登录态），不抓。
# 院系清单来源：www.sufe.edu.cn/yxsz/list.htm。
